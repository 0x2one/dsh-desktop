appId: com.dsh.desktop
productName: DeepSeek Harness Desktop
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!.github/**'
asarUnpack:
  - resources/**
extraResources:
  - from: plugins/dsh-desktop-window-controls/lib
    to: plugins/dsh-desktop-window-controls/lib
    filter:
      - '**/*'
  - from: plugins/dsh-desktop-window-controls/package.json
    to: plugins/dsh-desktop-window-controls/package.json
  - from: plugins/dsh-desktop-settings/lib
    to: plugins/dsh-desktop-settings/lib
    filter:
      - '**/*'
  - from: plugins/dsh-desktop-settings/package.json
    to: plugins/dsh-desktop-settings/package.json
win:
  # Process image, Task Manager, and the install folder all use this name.
  executableName: DeepSeek Harness Desktop
  # PNG is the source of truth (same whale as resources/icon.png / pnpm dev).
  # Default would be build/icon.ico, which can lag behind after the template icon is replaced.
  icon: icon.png
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: DeepSeek Harness Desktop
  uninstallDisplayName: DeepSeek Harness Desktop
  createDesktopShortcut: always
  # One-click wizard is always light (#FFFFFF). App icon is a white whale
  # for the taskbar, so the installer uses a black mark instead.
  installerHeaderIcon: installerHeaderIcon.ico
  installerIcon: installerHeaderIcon.ico
  uninstallerIcon: installerHeaderIcon.ico
  # Force-kill the tray-resident exe (close-to-tray swallows WM_CLOSE).
  include: installer.nsh
mac:
  icon: icon.png
  category: public.app-category.developer-tools
  # dmg for distribution, zip for electron-updater (latest-mac.yml).
  target:
    - dmg
    - zip
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}-mac-${arch}.${ext}
linux:
  icon: icon.png
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: 0x2one
  repo: dsh-desktop
  # Draft so concurrent artifact uploads attach to one GitHub Release.
  # Publish the draft by hand after CI finishes (electron-updater ignores drafts).
  releaseType: draft
