<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>新增环境</title>
    <link rel="icon" href="./icon.png" />
    <style>
      :root {
        color-scheme: light dark;
        --ink: #1c1917;
        --muted: #78716c;
        --line: #e7e5e4;
        --fill: #fafaf9;
        --accent: #0f766e;
        --accent-ink: #f0fdfa;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f5f5f4;
          --muted: #a8a29e;
          --line: #292524;
          --fill: #1c1917;
          --accent: #2dd4bf;
          --accent-ink: #042f2e;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font: 13px/1.45 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--ink);
        background: var(--fill);
      }
      form {
        height: 100%;
        padding: 18px 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      label {
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      input {
        width: 100%;
        height: 34px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        outline: none;
      }
      input:focus {
        border-color: var(--accent);
      }
      .hint {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .error {
        margin: 0;
        min-height: 1.2em;
        color: #dc2626;
        font-size: 12px;
      }
      .row {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: auto;
      }
      button {
        height: 30px;
        padding: 0 14px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--accent-ink);
      }
    </style>
  </head>
  <body>
    <form id="form">
      <label for="name">环境名称</label>
      <input
        id="name"
        name="name"
        autocomplete="off"
        spellcheck="false"
        placeholder="例如 work 或 team-a"
        autofocus
      />
      <p class="hint">小写字母、数字和连字符。创建后会切换到该环境。</p>
      <p class="error" id="error"></p>
      <div class="row">
        <button type="button" id="cancel">取消</button>
        <button type="submit" class="primary">创建</button>
      </div>
    </form>
    <script>
      const { ipcRenderer } = require('electron')
      const form = document.getElementById('form')
      const input = document.getElementById('name')
      const error = document.getElementById('error')
      const cancel = document.getElementById('cancel')

      form.addEventListener('submit', (event) => {
        event.preventDefault()
        const value = String(input.value || '')
        ipcRenderer.send('dsh-desktop:profile-prompt', value)
      })
      cancel.addEventListener('click', () => {
        ipcRenderer.send('dsh-desktop:profile-prompt', null)
      })
      ipcRenderer.on('dsh-desktop:profile-prompt-error', (_event, message) => {
        error.textContent = String(message || '')
        input.focus()
        input.select()
      })
    </script>
  </body>
</html>
