<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>快捷键</title>
    <link rel="icon" href="./icon.png" />
    <style>
      :root {
        color-scheme: light dark;
        --ink: #1c1917;
        --muted: #78716c;
        --line: #e7e5e4;
        --fill: #fafaf9;
        --accent: #0f766e;
        --accent-ink: #f0fdfa;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #f5f5f4;
          --muted: #a8a29e;
          --line: #292524;
          --fill: #1c1917;
          --accent: #2dd4bf;
          --accent-ink: #042f2e;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font:
          13px/1.45 'Segoe UI',
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
        color: var(--ink);
        background: var(--fill);
      }
      form {
        height: 100%;
        padding: 18px 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      label {
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      input {
        width: 100%;
        height: 34px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        outline: none;
        cursor: pointer;
      }
      input:focus {
        border-color: var(--accent);
      }
      .hint {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .error {
        margin: 0;
        min-height: 1.2em;
        color: #dc2626;
        font-size: 12px;
      }
      .row {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 8px;
        margin-top: auto;
      }
      .row .spacer {
        margin-right: auto;
      }
      button {
        height: 30px;
        padding: 0 14px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--accent-ink);
      }
    </style>
  </head>
  <body>
    <form id="form">
      <label for="hotkey">显示 / 隐藏窗口</label>
      <input
        id="hotkey"
        name="hotkey"
        type="text"
        autocomplete="off"
        spellcheck="false"
        placeholder="按下新的快捷键"
        readonly
        autofocus
      />
      <p class="hint">点击输入框后按下组合键。需包含 Ctrl、Alt 或 Shift。</p>
      <p class="error" id="error"></p>
      <div class="row">
        <button type="button" id="reset" class="spacer">恢复默认</button>
        <button type="button" id="cancel">取消</button>
        <button type="submit" class="primary">保存</button>
      </div>
    </form>
    <script>
      const { ipcRenderer } = require('electron')
      const CHANNEL = {
        init: 'dsh-desktop:hotkey-prompt:init',
        preview: 'dsh-desktop:hotkey-prompt:preview',
        save: 'dsh-desktop:hotkey-prompt:save',
        error: 'dsh-desktop:hotkey-prompt:error',
        cancel: 'dsh-desktop:hotkey-prompt:cancel'
      }
      const form = document.getElementById('form')
      const input = document.getElementById('hotkey')
      const error = document.getElementById('error')
      const cancel = document.getElementById('cancel')
      const reset = document.getElementById('reset')

      let pending = ''
      let defaultAccelerator = 'Control+Alt+Space'
      let defaultLabel = 'Ctrl + Alt + 空格'

      ipcRenderer.on(CHANNEL.init, (_event, data) => {
        pending = String(data.accelerator || '')
        input.value = String(data.label || '')
        defaultAccelerator = String(data.defaultAccelerator || defaultAccelerator)
        defaultLabel = String(data.defaultLabel || defaultLabel)
        input.focus()
      })

      input.addEventListener('keydown', (event) => {
        event.preventDefault()
        event.stopPropagation()
        if (event.repeat) return
        if (
          event.key === 'Escape' &&
          !event.ctrlKey &&
          !event.altKey &&
          !event.shiftKey &&
          !event.metaKey
        ) {
          ipcRenderer.send(CHANNEL.cancel)
          return
        }
        void ipcRenderer
          .invoke(CHANNEL.preview, {
            ctrlKey: event.ctrlKey,
            altKey: event.altKey,
            shiftKey: event.shiftKey,
            metaKey: event.metaKey,
            code: event.code,
            key: event.key
          })
          .then((result) => {
            if (result === null || result === undefined) return
            pending = String(result.accelerator || '')
            input.value = String(result.label || '')
            error.textContent = ''
          })
      })

      form.addEventListener('submit', (event) => {
        event.preventDefault()
        if (pending === '') {
          error.textContent = '请先按下要使用的快捷键。'
          input.focus()
          return
        }
        ipcRenderer.send(CHANNEL.save, pending)
      })
      reset.addEventListener('click', () => {
        pending = defaultAccelerator
        input.value = defaultLabel
        error.textContent = ''
        input.focus()
      })
      cancel.addEventListener('click', () => {
        ipcRenderer.send(CHANNEL.cancel)
      })
      ipcRenderer.on(CHANNEL.error, (_event, message) => {
        error.textContent = String(message || '')
        input.focus()
      })
    </script>
  </body>
</html>
